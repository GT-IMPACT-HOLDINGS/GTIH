<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tegria is building for software teams that ship with AI.">
  <title>Tegria</title>
  <style>
    :root { color-scheme: dark; --background: #070C1F; --text: #4970FF; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--background);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    header, main {
      width: min(calc(100% - 2 * clamp(1.5rem, 7vw, 6rem)), 76rem);
      margin-inline: auto;
    }
    header { padding-block: 2rem; font-size: 1.3rem; font-weight: 700; }
    main { align-self: center; padding-block: 3rem clamp(4rem, 12vh, 9rem); }
    h1 {
      max-width: 15ch;
      margin: 0;
      font-size: clamp(2.65rem, 7.6vw, 7rem);
      line-height: 1;
      letter-spacing: -.065em;
      text-wrap: balance;
    }
    p { max-width: 48ch; margin: 1.5rem 0 2rem; font-size: 1.125rem; line-height: 1.55; }
  </style>
</head>
<body>
  <header>Tegria</header>
  <main>
    <h1>We’re building for software teams that ship with AI.</h1>
    <p>Writing code is getting faster. Agreeing on what should ship and verifying that it works still takes time.</p>
  </main>
</body>
</html>
