# Outcome Specification Node (OSN)
#
# See also: OSNG_Basics_README.md at the Lexiom_1_3 root — filename conventions
# for reconstructing the OSN Graph and linking evidentiary artifacts from names.
#
# An OSN is a human-owned semantic source file. Core fields: id and file_name
# (must match the on-disk stem), owner, seed, thematic_lenses, output_spec,
# success_evidences, compilation, and graph. The seed states intention;
# thematic_lenses name professional perspectives; output_spec states the
# outcome contract; success_evidences name how fulfillment will be inspected.
#
# Graph links: set graph.parent_osn_ids to the parent OSN id(s) and list this
# node in each parent's graph.child_osn_ids (reciprocal). Optional
# standard_ancestor_osn_ids reference organizational standards beyond the
# local parent chain. On disk, prefer hierarchical stems
# {ancestor.path}.{leaf}.{unique_id}.osn.yaml so filenames sketch ancestry;
# when path prefixes and graph.* disagree, graph.* is authoritative.
schema_version: osn/0.2
id: WebAppSecurity.AccessControl.a1000101.osn
file_name: WebAppSecurity.AccessControl.a1000101.osn
node_type: discipline
discipline: Access Control
title: Access Control
owner:
  owner_id: dror
  display_name: Dror Levin
  role: Access Control OSN Owner
graph:
  parent_osn_ids:
    - WebAppSecurity.a1000100.osn
  child_osn_ids:
    - WebAppSecurity.AccessControl.Authentication.a1000103.osn
    - WebAppSecurity.AccessControl.Authorization.a1000104.osn
  standard_ancestor_osn_ids: []
  derived_from_lens_id: lens.security.web_app.professional_craft
seed: >-
  Ensure every privileged web-application action is gated by proven identity and
  explicit permission — never by obscurity, client trust, or ambient session luck.
thematic_lenses:
  - lens_id: lens.security.access_control.professional_craft
    name: Access Control
    purpose: Apply access-control judgment to this outcome.
  - lens_id: lens.security.access_control.least_privilege
    name: Least Privilege
    purpose: Keep grants minimal, time-bounded, and reviewable.
  - lens_id: lens.security.access_control.evidence
    name: Evidence and Claims
    purpose: Require inspectable delivery and classify claims according to available proof.
output_spec: |-
  1. Come explore how Lexiom 1.3 currently gates privileged actions — then explore Access
  Control, Least Privilege, and Evidence and Claims below for the code-backed rebuild contract.
  
  ## Access Control
  2. Live as navigable WebAppSecurity-descendant YAML under security/ with Authentication and
  Authorization children listed reciprocally.
  3. Remain ProductLexiom's standard_ancestor so PlaneShift can present AccessControl as an
  additional thematic plane beside the native ProductLexiom branch.
  4. Separate proving who the actor is (Authentication) from deciding what the actor may do
  (Authorization) as sibling leaves — do not collapse them into one opaque gate node.
  
  ## Least Privilege
  5. Keep privileged CA workspace writes on a relative-path allowlist and block `..` / absolute
  paths in sealedOsngBounds so agent tools cannot wander outside the prepared run folder.
  6. Keep evidence-pass Jobs host-only in the browser CA path so the player WebContainer cannot
  widen write authority into evidence collection.
  7. Do not invent cockpit role pickers, admin routes, or client-asserted permission claims as
  authoritative Lexiom 1.3 SPA behavior — the POC has no login identity surface.
  
  ## Evidence and Claims
  8. Inspect fulfillment via TEXTUAL_SNIPPET evidence quoted from a delivered access-control
  review or hardening artifact (SUD), never from this OSN's own seed, lenses, or output_spec.
success_evidences:
  - evidence_id: sev.security.access_control.delivered_artifact
    kind: TEXTUAL_SNIPPET
    direct: true
    inspection_prompt: >-
      From the delivered access-control review or hardening artifact (SUD), extract
      a single readable quoted passage that shows how the application fulfills this
      node's outcome: Ensure every privileged web-application action is gated by
      proven identity and explicit permission — never by obscurity, client trust, or
      ambient session luck. The quote must come from the delivered artifact itself —
      not from this OSN's seed, lenses, or output_spec. Deliver the snippet as the
      evidence artifact.
compilation:
  can_be_compilation_root: false
  compilation_scope: self_only
  target_tool_profile: null
