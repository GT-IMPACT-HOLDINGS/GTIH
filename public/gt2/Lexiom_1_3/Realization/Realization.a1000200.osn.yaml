# Outcome Specification Node (OSN)
#
# See also: OSNG_Basics_README.md at the Lexiom_1_3 root — filename conventions
# for reconstructing the OSN Graph and linking evidentiary artifacts from names.
#
# An OSN is a human-owned semantic source file. Core fields: id and file_name
# (must match the on-disk stem), owner, seed, thematic_lenses, output_spec,
# success_evidences, compilation, and graph. Optional post-build bud is a
# bloom pointer written only by Lexiom/GT3 after a successful VAL run — never
# by agents. The seed states intention; thematic_lenses name professional
# perspectives; output_spec states the outcome contract; success_evidences
# name how fulfillment will be inspected.
#
# Graph links: set graph.parent_osn_ids to the parent OSN id(s) and list this
# node in each parent's graph.child_osn_ids (reciprocal). Optional
# standard_ancestor_osn_ids reference organizational standards beyond the
# local parent chain. On disk, prefer hierarchical stems
# {ancestor.path}.{leaf}.{unique_id}.osn.yaml so filenames sketch ancestry;
# when path prefixes and graph.* disagree, graph.* is authoritative.
schema_version: osn/0.2
id: Realization.a1000200.osn
file_name: Realization.a1000200.osn
node_type: organizational_standard
title: Realization
owner:
  owner_id: dror
  display_name: Dror Levin
  role: Realization Plane OSN Owner
graph:
  parent_osn_ids: []
  child_osn_ids:
    - Realization.RealizeProductLexiom.a1000201.osn
    - Realization.RealizeBrandLexiom.a1000202.osn
  standard_ancestor_osn_ids: []
  derived_from_lens_id: null
seed: >
  Hold the Realization thematic plane as the native trunk from which Lexiom makes ProductLexiom
  and BrandLexiom real through dedicated build-entry OSNs, without copying those specifications.
thematic_lenses:
  - lens_id: lens.realization.plane
    name: Realization Plane
    purpose: Keep Realization a distinct native plane named from this eldest origin-leaf.
  - lens_id: lens.realization.build_entry
    name: Build Entry Authority
    purpose: Place independently buildable Realize OSNs on this trunk, not on the spec trees.
  - lens_id: lens.realization.provenance
    name: Provenance of Making-Real
    purpose: Keep CI/CD, evidence collection, and provenance on Realization nodes, not duplicated specs.
output_spec: |-
  1. Enter the Realization plane as the native trunk from which Lexiom makes ProductLexiom and
  BrandLexiom real — then explore Realization Plane, Build Entry Authority, and Provenance of
  Making-Real below for the code-backed rebuild contract.

  ## Realization Plane
  2. Host Realization as an OSNG graph root (empty parent_osn_ids) whose origin-leaf names the
  native thematic plane Realization, stored under Realization/ beside Branding/ and security/.
  3. Keep ProductLexiom and BrandLexiom native to GT Philosophy; do not re-parent those spec
  OSNs onto this trunk.
  4. Show this tree in Side view and OSNG Garden as its own plane, with dashed standard-ancestor
  arrows from Realize children to their cited spec OSNs.

  ## Build Entry Authority
  5. List RealizeProductLexiom and RealizeBrandLexiom as native children with reciprocal
  child_osn_ids / parent_osn_ids.
  6. Do not set can_be_compilation_root on this trunk; compilation_scope remains self_only so a
  trunk compile does not mix Product and Brand cones.
  7. Let each Realize child be an independently buildable compilation root with compilation_scope
  self_as_axis_center.

  ## Provenance of Making-Real
  8. Keep seed, lenses, and output_spec on this trunk about plane identity and build-entry
  placement — never restated ProductLexiom or BrandLexiom specification text.
  9. Declare direct success evidence as a SCREEN-SHOT of the delivered cockpit OSNG showing this
  Realization tree, never this OSN's own specification fields.
success_evidences:
  - evidence_id: sev.realization.plane.garden_screenshot
    kind: SCREEN-SHOT
    direct: true
    inspection_prompt: >-
      From the delivered Lexiom 1.3 cockpit (SUD), capture a still image of Side view or OSNG Garden
      that shows the Realization tree as its own thematic plane, with RealizeProductLexiom and
      RealizeBrandLexiom as native children of Realization, and dashed standard-ancestor arrows
      toward ProductLexiom and BrandLexiom. The image must be of the running cockpit graph — not
      this OSN's seed, lenses, or output_spec. Deliver the image file as the evidence artifact.
compilation:
  can_be_compilation_root: false
  compilation_scope: self_only
  target_tool_profile: null
