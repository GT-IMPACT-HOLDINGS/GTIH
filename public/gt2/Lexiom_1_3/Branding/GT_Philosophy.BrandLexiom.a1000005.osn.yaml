# Outcome Specification Node (OSN)
#
# See also: OSNG_Basics_README.md at the Lexiom_1_3 root — filename conventions
# for reconstructing the OSN Graph and linking evidentiary artifacts from names.
#
# An OSN is a human-owned semantic source file. Core fields: id and file_name
# (must match the on-disk stem), owner, seed, thematic_lenses, output_spec,
# success_evidences, compilation, and graph. Optional post-build bud is a
# bloom pointer written only by Lexiom/GT3 after a successful VAL run — never
# by agents. The seed states intention; thematic_lenses name professional
# perspectives; output_spec states the outcome contract; success_evidences
# name how fulfillment will be inspected.
#
# Graph links: set graph.parent_osn_ids to the parent OSN id(s) and list this
# node in each parent's graph.child_osn_ids (reciprocal). Optional
# standard_ancestor_osn_ids reference organizational standards beyond the
# local parent chain. On disk, prefer hierarchical stems
# {ancestor.path}.{leaf}.{unique_id}.osn.yaml so filenames sketch ancestry;
# when path prefixes and graph.* disagree, graph.* is authoritative.
schema_version: osn/0.2
id: GT_Philosophy.BrandLexiom.a1000005.osn
file_name: GT_Philosophy.BrandLexiom.a1000005.osn
node_type: product
title: Lexiom 1.3 — Ogun Brand
owner:
  owner_id: dror
  display_name: Dror Levin
  role: Brand Leadership OSN Owner
graph:
  parent_osn_ids:
    - GT_Philosophy.a1000001.osn
  child_osn_ids:
    - GT_Philosophy.BrandLexiom.BrandStrategy.a1000006.osn
    - GT_Philosophy.BrandLexiom.BrandExpression.a1000007.osn
  standard_ancestor_osn_ids: []
  derived_from_lens_id: lens.constellation.value_flow
source_spec:
  document: Branding/branding_spec.md
  sections: §§1–2 and §§24–28
seed: >-
  Govern the complete enterprise brand for Lexiom 1.3 — Ogun as the service that turns human
  intention into governed, inspectable, evidence-backed outcomes.
thematic_lenses:
  - lens_id: lens.brand.brand_lexiom.professional_craft
    name: Brand Leadership
    purpose: Apply brand leadership judgment to this outcome.
  - lens_id: lens.brand.brand_lexiom.human_authority
    name: Human Authority
    purpose: Keep proposals distinct from approved organizational truth.
  - lens_id: lens.brand.brand_lexiom.evidence
    name: Evidence and Claims
    purpose: Require inspectable delivery and classify claims according to available proof.
output_spec: |-
  1. Enter how Lexiom currently holds the complete enterprise brand for Lexiom 1.3 — Ogun
  as the service that turns human intention into governed, inspectable, evidence-backed
  outcomes — then explore Brand Leadership, Human Authority, and Evidence and Claims below
  for the code-backed rebuild contract.

  ## Brand Leadership
  2. Host BrandLexiom as the Branding/ sibling product branch under GT_Philosophy, with
  BrandStrategy and BrandExpression children discoverable in the same OSN graph as
  ProductLexiom.
  3. Remain a document_agent compilation root (compilation_scope
  self_and_approved_descendants) so prepare/run maps this branch to
  lexiom13.document_builder rather than the software-coding builder.
  4. After a successful document VAL run, carry a bud bloom pointing at the delivered
  branding-book document.md so Center Bud can open the SUD without rewriting seed, lenses,
  or output_spec.
  5. Keep the Build handoff/report card as plugin/run telemetry only — the delivered Ogun
  brand book is reviewed through Bud and evidence snippets, not inside the Build card.

  ## Human Authority
  6. Edit BrandLexiom sections only as cockpit draft cards; mutate Branding/*.osn.yaml on
  disk only after explicit White Move approve through the shared persist/canonize path.
  7. Treat document-builder and GT3 proposals as non-canonical until a human approves; Bud
  review of document.md must not silently rewrite intention fields.

  ## Evidence and Claims
  8. Declare direct success evidence as TEXTUAL_SNIPPET excerpts taken from the delivered
  branding-book document.md (SUD), never from this OSN's own seed, lenses, or output_spec.
success_evidences:
  - evidence_id: sev.brand.brand_lexiom.delivered_artifact
    kind: TEXTUAL_SNIPPET
    direct: true
    inspection_prompt: >-
      From the delivered Ogun branding book markdown (the SUD document.md / brand-book artifact
      produced by the document builder), extract a single readable quoted passage that shows how the
      book fulfills this node's outcome: Govern the complete enterprise brand for Lexiom 1.3 — Ogun
      as the service that turns human intention into governed, inspectable, evidence-backed
      outcomes. The quote must be taken verbatim (or as a contiguous excerpt) from the produced
      branding book itself — not from this OSN's seed, lenses, or output_spec. Prefer a paragraph or
      short section that a reviewer can inspect directly to confirm the "Lexiom 1.3 — Ogun Brand"
      requirement became real in the book. Format it as a copy-pasteable excerpt suitable for direct
      review. Deliver the snippet as the evidence artifact.
compilation:
  can_be_compilation_root: true
  compilation_scope: self_and_approved_descendants
  target_tool_profile: document_agent
bud:
  schema_version: lexiom13-bud/1
  run_id: mt331yzc_3807ecab
  plugin_id: lexiom13.document_builder
  media_kind: document
  entry_file_name: document.md
  preview_path: null
  artifact_path: /lexiom13/build/mt331yzc_3807ecab/artifact/document.md
  status: ready
  completed_at: "2026-08-21T15:09:07.928Z"
