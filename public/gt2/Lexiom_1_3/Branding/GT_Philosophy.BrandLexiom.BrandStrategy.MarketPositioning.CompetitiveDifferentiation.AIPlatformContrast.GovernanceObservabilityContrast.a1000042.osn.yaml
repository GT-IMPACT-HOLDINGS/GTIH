output_spec: |-
  1. Open how Lexiom currently explains that the current POC gates canonical OSN writes
  through explicit human actions and carries explicitly linked standard ancestors into
  lineage context and build snapshots; policy enforcement, live conflict detection, and
  Concordance resolution are not implemented — then explore AI Governance Analysis and
  Evidence and Claims below for the code-backed rebuild contract.

  ## AI Governance Analysis
  2. Live as navigable BrandLexiom-descendant YAML under Branding/ so this node's approved
  sections can enter BrandLexiom document-builder compiles when compilation_scope includes
  approved descendants.

  ## Evidence and Claims
  3. Inspect fulfillment via TEXTUAL_SNIPPET evidence quoted from the delivered
  branding-book document.md (SUD), never from this OSN's own seed, lenses, or output_spec.
success_evidences:
  - evidence_id: sev.brand.governance_observability_contrast.delivered_artifact
    kind: TEXTUAL_SNIPPET
    direct: true
    inspection_prompt: >-
      From the delivered Ogun branding book markdown (the SUD document.md / brand-book
      artifact produced by the document builder), extract a single readable quoted passage
      that shows how the book fulfills this node's outcome: Explain that the current POC gates
      canonical OSN writes through explicit human actions and carries explicitly linked
      standard ancestors into lineage context and build snapshots; policy enforcement, live
      conflict detection, and Concordance resolution are not implemented. The quote must be
      taken verbatim (or as a contiguous excerpt) from the produced branding book itself — not
      from this OSN's seed, lenses, or output_spec. Prefer a paragraph or short section that a
      reviewer can inspect directly to confirm the "AI Governance and Observability Contrast"
      requirement became real in the book. Format it as a copy-pasteable excerpt suitable for
      direct review. Deliver the snippet as the evidence artifact.
compilation:
