<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-title="landing_page_title">Lexiom Entry</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body class="lexiom-body">
  <div id="lexiom-main-wrap" class="lexiom-main-wrap lexiom-intro-done">
    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
      <div id="lexiom-cabinet" class="lexiom-cabinet border">
        <main class="lexiom-main flex-grow-1 d-flex flex-column">
          <header
            class="lexiom-top-hud d-flex flex-column justify-content-center align-items-center text-center"
          >
            <div class="lexiom-top-hud-l1 fw-bold text-center" data-i18n="landing_welcome_title">
              WELCOME TO LEXIOM
            </div>
          </header>

          <section class="flex-grow-1 d-flex justify-content-center align-items-center">
            <div class="lexiom-onboarding-card">
              <section id="landing-step-0" class="landing-step">
                <div class="d-grid gap-2 d-md-flex justify-content-center">
                  <button id="landing-btn-new" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-primary" data-i18n="landing_btn_new">
                    I am new to Lexiom
                  </button>
                  <button id="landing-btn-returning" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-secondary" data-i18n="landing_btn_returning">
                    I am returning
                  </button>
                </div>
              </section>

              <section id="landing-step-1" class="landing-step" hidden>
                <h2 class="lexiom-onboarding-heading" data-i18n="landing_step1_heading">Select your role</h2>
                <div id="landing-role-grid" class="d-grid gap-2">
                  <button class="btn btn-sm lexiom-clickable landing-role-btn lexiom-onboarding-role-btn" data-role="Lawyer" data-i18n="landing_role_lawyer" type="button">
                    Lawyer
                  </button>
                  <button class="btn btn-sm lexiom-clickable landing-role-btn lexiom-onboarding-role-btn" data-role="Mediator" data-i18n="landing_role_mediator" type="button">
                    Mediator
                  </button>
                  <button class="btn btn-sm lexiom-clickable landing-role-btn lexiom-onboarding-role-btn" data-role="Sales Professional" data-i18n="landing_role_sales" type="button">
                    Sales Professional
                  </button>
                  <button class="btn btn-sm lexiom-clickable landing-role-btn lexiom-onboarding-role-btn" data-role="Non-Professional" data-i18n="landing_role_nonpro" type="button">
                    Non-Professional
                  </button>
                </div>
                <div class="mt-3 d-flex justify-content-end">
                  <button id="landing-step-1-next" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-primary" disabled data-i18n="landing_continue">
                    Continue
                  </button>
                </div>
              </section>

              <section id="landing-step-2" class="landing-step" hidden>
                <h2 class="lexiom-onboarding-heading" data-i18n="landing_step2_heading">Your strategic value proposition</h2>
                <label for="landing-value-input" class="lexiom-onboarding-copy d-block mb-2" data-i18n="landing_value_label">
                  How do you see your unique strategic value proposition in your professional world?
                </label>
                <textarea
                  id="landing-value-input"
                  class="form-control lexiom-onboarding-textarea"
                  rows="12"
                  maxlength="1200"
                ></textarea>
                <div class="mt-3 d-flex gap-2 justify-content-between">
                  <button id="landing-step-2-back" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-secondary" data-i18n="landing_back">
                    Back
                  </button>
                  <button id="landing-step-2-next" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-primary" data-i18n="landing_continue">
                    Continue
                  </button>
                </div>
              </section>

              <section id="landing-step-4" class="landing-step" hidden>
                <h2 class="lexiom-onboarding-heading" data-i18n="landing_step4_heading">Outbound draft voice</h2>
                <textarea
                  id="landing-principal-draft"
                  class="form-control lexiom-onboarding-textarea"
                  rows="4"
                  maxlength="200"
                ></textarea>
                <div class="mt-3 d-flex gap-2 justify-content-between">
                  <button id="landing-step-4-back" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-secondary" data-i18n="landing_back">
                    Back
                  </button>
                  <button id="landing-step-4-approve" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-primary" data-i18n="landing_approve_profile">
                    Approve profile
                  </button>
                </div>
              </section>

              <section id="landing-step-5" class="landing-step" hidden>
                <p id="landing-welcome" class="lexiom-onboarding-copy mb-3"></p>
                <div class="d-grid gap-2 d-md-flex justify-content-center">
                  <button id="landing-mode-zenith" type="button" class="btn btn-sm lexiom-clickable lexiom-onboarding-btn-primary" data-i18n="landing_begin_zenith">
                    Begin in Zenith
                  </button>
                </div>
              </section>

              <div id="landing-error" class="lexiom-onboarding-error mt-3" hidden></div>
            </div>
          </section>

          <footer
            class="lexiom-bottom-ribbon d-flex justify-content-center align-items-center text-center"
          >
            <div class="landing-footer-progress-wrap">
              <span id="landing-status" class="lexiom-onboarding-status">0/5 — New or returning</span>
            </div>
          </footer>
        </main>
      </div>
    </div>
  </div>
  <!-- Fullscreen black + title after exit staggered fade (before cockpit redirect) -->
  <div id="landing-exit-root" class="landing-exit-root" hidden aria-hidden="true">
    <img
      id="landing-exit-title"
      class="landing-exit-title-img"
      src="Lexiom_Title.png"
      alt="Lexiom"
    />
  </div>

  <script src="gt3-client.js"></script>
  <script src="lexiom-i18n.js"></script>
  <script src="landing.js"></script>
</body>
</html>
