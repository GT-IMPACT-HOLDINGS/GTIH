name: Docker Image CI

on:
  push:
    branches: [ "Ogun" ]
  pull_request:
    branches: [ "Ogun" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Sets up Docker Buildx (required for advanced caching features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Builds the image and automatically exports it as a .tar file
    - name: Build and export Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        tags: gtih-image:latest
        outputs: type=docker,dest=gtih-image.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Upload image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-artifact
        path: gtih-image.tar


      # Loads the tar file back into the local runner's Docker daemon
    - name: Load Docker image
      run: |
        docker load -i gtih-image.tar

    # Runs the container inside the runner environment
    - name: Run Docker container
      run: |
        docker run -d -p 8080:8080 --name test-app gtih-image:latest
        
    # Optional: Verify it is running or run automated integration tests
    - name: Test local container endpoint
      run: |
        sleep 5
        curl -f http://localhost:8080 || exit 1
