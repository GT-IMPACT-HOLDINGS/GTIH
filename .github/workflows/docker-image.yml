name: Docker Image CI

on:
  push:
    branches: [ "Ogun" ]
  pull_request:
    branches: [ "Ogun" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

      
      # 1. Add this step to convert the repository name to lowercase
    - name: Downcase repository name
      run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        

    # Sets up Docker Buildx (required for advanced caching features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    # This builds and PUSHES the image to GHCR so Render can see it
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # The tag below formats to lower case which GHCR requires
        tags: ghcr.io/${{ env.REPO_LOWER }}/gtih-image:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GT3_LEXIOM_DEMO_KEY=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
          GT3_LEXIOM_AGENT_KEY=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

      

    # Builds the image and automatically exports it as a .tar file
    #- name: Build and export Docker image
  #    uses: docker/build-push-action@v6
   #   with:
    #    context: .
  #      file: ./Dockerfile
  #      tags: gtih-image:latest
  #      outputs: type=docker,dest=gtih-image.tar
  #      cache-from: type=gha
   #     cache-to: type=gha,mode=max

  #  - name: Upload image as artifact
  #    uses: actions/upload-artifact@v4
  #    with:
  #      name: docker-image-artifact
  #      path: gtih-image.tar

# deploy to Render
  deploy:
           needs: build
           runs-on: ubuntu-latest
           if: github.ref == 'refs/heads/Ogun' && github.event_name == 'push'
    
           steps:
           - name: Trigger Render Deployment
             run: |
              curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
