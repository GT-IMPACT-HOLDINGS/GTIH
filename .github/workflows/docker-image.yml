name: Docker Image CI

on:
  push:
    branches: [ "Ogun" ]
  pull_request:
    branches: [ "Ogun" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        

    # Sets up Docker Buildx (required for advanced caching features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3




    # This builds and PUSHES the image to GHCR so Render can see it
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # The tag below formats to lower case which GHCR requires
        tags: ghcr.io/${{ github.repository_owner }}/gtih-image:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

      

    # Builds the image and automatically exports it as a .tar file
    #- name: Build and export Docker image
  #    uses: docker/build-push-action@v6
   #   with:
    #    context: .
  #      file: ./Dockerfile
  #      tags: gtih-image:latest
  #      outputs: type=docker,dest=gtih-image.tar
  #      cache-from: type=gha
   #     cache-to: type=gha,mode=max

  #  - name: Upload image as artifact
  #    uses: actions/upload-artifact@v4
  #    with:
  #      name: docker-image-artifact
  #      path: gtih-image.tar

# deploy to Render
  deploy:
           needs: build
           runs-on: ubuntu-latest
           if: github.ref == 'refs/heads/Ogun' && github.event_name == 'push'
    
           steps:
           - name: Trigger Render Deployment
             run: |
              curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
