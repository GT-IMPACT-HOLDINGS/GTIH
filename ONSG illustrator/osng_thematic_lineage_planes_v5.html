<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSNG Thematic Lineage Planes — v5</title>
  <style>
    :root {
      --ink: #17243d;
      --muted: #64748b;
      --line: #7b8ca7;
      --plane-border: #b8c4d6;
      --plane-fill: #f8fafc;
      --node-fill: #ffffff;
      --node-border: #53657e;
      --selected: #1267d6;
      --selected-border: #084da8;
      --participant: #cfe7ff;
      --participant-border: #5a9be2;
      --accent: #1267d6;
      --focus: #ffb84d;
      --shadow: 0 12px 30px rgba(24, 45, 79, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 960px;
      min-height: 100vh;
      color: var(--ink);
      background: #ffffff;
      font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: flex;
      align-items: stretch;
      gap: 18px;
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }

    .controls {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 16px 14px;
      border: 1px solid #d7dfeb;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(24, 45, 79, 0.06);
    }

    .toolbox-title {
      margin: 0;
      color: #4a5c74;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .reveal-controls,
    .action-controls {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .action-controls {
      padding-top: 16px;
      border-top: 1px solid #d7dfeb;
    }

    .teaching-note {
      margin: 0;
      padding: 10px 11px;
      border: 1px dashed #c5d2e3;
      border-radius: 9px;
      color: #5a6d86;
      background: #f8fafc;
      font-size: 12px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      min-height: 34px;
      padding: 7px 13px;
      border: 1px solid #9aabc2;
      border-radius: 8px;
      color: var(--ink);
      background: #ffffff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      text-align: left;
    }

    button:hover:not(:disabled) { background: #f1f6fc; }
    button:focus-visible { outline: 3px solid rgba(255, 184, 77, 0.7); outline-offset: 2px; }
    button:disabled { opacity: 0.42; cursor: not-allowed; }
    button.active { color: #ffffff; border-color: var(--selected-border); background: var(--selected); }

    .standard-ancestor-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .standard-ancestor-label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
    }

    .standard-ancestor-buttons {
      display: flex;
      gap: 6px;
    }

    .build-scope-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .build-scope-label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
    }

    .build-scope-select {
      width: 100%;
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid #9aabc2;
      border-radius: 8px;
      color: var(--ink);
      background: #ffffff;
      font: inherit;
      font-weight: 600;
    }

    .build-scope-select:focus-visible {
      outline: 3px solid rgba(255, 184, 77, 0.7);
      outline-offset: 2px;
    }

    button.compact {
      width: 34px;
      min-width: 34px;
      min-height: 34px;
      padding: 0;
      text-align: center;
      font-size: 18px;
      line-height: 1;
    }

    .status {
      flex: 1 1 auto;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #d7dfeb;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .board {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: calc(100vh - 32px);
      overflow: hidden;
      background: #ffffff;
    }

    .planes {
      position: absolute;
      inset: 24px 18px 54px;
      display: grid;
      gap: 94px;
    }

    .planes.count-1 {
      grid-template-columns: 1fr;
      max-width: min(720px, 100%);
      margin-inline: auto;
    }

    .planes.count-2 {
      grid-template-columns: 1fr 1fr;
    }

    .planes.count-many {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      max-width: 100%;
    }

    .layer-theme-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-theme-buttons {
      display: flex;
      gap: 6px;
    }

    .layer-theme-input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 34px;
      height: 34px;
      padding: 6px 10px;
      border: 1px solid #9aabc2;
      border-radius: 8px;
      color: var(--ink);
      background: #ffffff;
      font: inherit;
      line-height: 1.4;
      resize: none;
      overflow: hidden;
    }

    .layer-theme-input:focus-visible {
      outline: 3px solid rgba(255, 184, 77, 0.7);
      outline-offset: 2px;
    }

    .plane {
      position: relative;
      min-width: 0;
      overflow: visible;
      border: 2px solid var(--plane-border);
      border-radius: 18px;
      background: var(--plane-fill);
      box-shadow: var(--shadow);
    }

    .plane-title {
      position: absolute;
      top: 28px;
      left: 22px;
      z-index: 3;
      margin: 0;
      color: #4a5c74;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 0.02em;
    }

    .node {
      position: absolute;
      z-index: 4;
      width: 124px;
      min-height: 48px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      padding: 8px 10px;
      border: 2px solid var(--node-border);
      border-radius: 10px;
      color: var(--ink);
      background: var(--node-fill);
      box-shadow: 0 5px 12px rgba(24, 45, 79, 0.08);
      font: inherit;
      font-weight: 700;
      text-align: center;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    .node.root {
      z-index: 5;
      border-color: var(--selected-border);
      box-shadow: 0 5px 12px rgba(24, 45, 79, 0.08), 0 0 0 3px rgba(18, 103, 214, 0.14);
    }

    .node:hover { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(18, 103, 214, 0.12); }
    .node.origin { color: #ffffff; border-color: var(--selected-border); background: var(--selected); }
    .node.participant { color: #123866; border-color: var(--participant-border); background: var(--participant); }
    .node.link-source { border-color: #d97706; background: #fff3d4; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18); }

    .edge-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .native-edge,
    .standard-edge {
      fill: none;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .native-edge { stroke: var(--line); stroke-width: 2; marker-end: url(#nativeArrow); }
    .standard-edge {
      stroke: #7c4daf;
      stroke-width: 2.5;
      stroke-dasharray: 8 7;
      marker-end: url(#standardArrow);
      pointer-events: stroke;
      cursor: pointer;
    }
    .standard-edge:hover { stroke: #b4238c; stroke-width: 4; }

    .legend {
      position: absolute;
      right: 22px;
      bottom: 12px;
      z-index: 5;
      display: none;
      align-items: center;
      gap: 16px;
      padding: 8px 11px;
      border: 1px solid #d7dfeb;
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.94);
      font-size: 13px;
    }

    .legend.show { display: flex; }
    .key { display: inline-flex; align-items: center; gap: 7px; }
    .swatch { width: 19px; height: 14px; border: 2px solid; border-radius: 4px; }
    .swatch.origin { border-color: var(--selected-border); background: var(--selected); }
    .swatch.participant { border-color: var(--participant-border); background: var(--participant); }

    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .node { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="controls" aria-label="OSNG presentation controls">
      <h1 class="toolbox-title">Toolbox</h1>
      <div class="reveal-controls">
        <div class="layer-theme-row">
          <textarea id="layerThemeInput" class="layer-theme-input" rows="1" placeholder="theme name" aria-label="Thematic layer name"></textarea>
          <div class="layer-theme-buttons">
            <button id="createLayer" class="compact" type="button" aria-label="Create layer">+</button>
            <button id="removeLayer" class="compact" type="button" disabled aria-label="Remove layer">-</button>
          </div>
        </div>
        <div class="standard-ancestor-control">
          <span class="standard-ancestor-label">intra-theme lineage</span>
          <div class="standard-ancestor-buttons">
            <button id="revealNativeLayer" class="compact" type="button" disabled aria-label="Create next OSN generation">+</button>
            <button id="hideNativeLayer" class="compact" type="button" disabled aria-label="Remove deepest revealed lineage generation">-</button>
          </div>
        </div>
        <div class="standard-ancestor-control">
          <span class="standard-ancestor-label">inter-themes lineage</span>
          <div class="standard-ancestor-buttons">
            <button id="standardAction" class="compact" type="button" disabled aria-label="Create standard ancestor">+</button>
            <button id="deleteStandardAction" class="compact" type="button" disabled aria-label="Delete standard ancestor link">-</button>
          </div>
        </div>
      </div>
      <div class="action-controls" aria-label="OSN actions">
        <div class="build-scope-control">
          <label class="build-scope-label" for="buildScopeSelect">build includes</label>
          <select id="buildScopeSelect" class="build-scope-select" aria-label="Build closure for simulation">
            <option value="native_axis" selected>OSN + descendants + native ancestors</option>
            <option value="with_cited_cones">+ cited standard-ancestor cones</option>
          </select>
        </div>
        <div class="standard-ancestor-control">
          <span class="standard-ancestor-label">Simulate an OSN build</span>
          <div class="standard-ancestor-buttons">
            <button id="buildAction" class="compact" type="button" disabled aria-label="Simulate an OSN build">+</button>
            <button id="clearAction" class="compact" type="button" disabled aria-label="Clear build highlight">-</button>
          </div>
        </div>
      </div>
      <p class="teaching-note hidden" id="teachingNote" role="status" aria-live="polite"></p>
      <div id="status" class="status" aria-live="polite">Enter a theme name and create a thematic lineage layer to begin.</div>
    </aside>

    <section id="board" class="board" aria-label="OSNG whiteboard">
      <div id="planes" class="planes hidden"></div>

      <svg id="edges" class="edge-layer hidden" aria-hidden="true">
        <defs>
          <marker id="nativeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8ca7"></path>
          </marker>
          <marker id="standardArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c4daf"></path>
          </marker>
        </defs>
        <g id="nativeEdges"></g>
        <g id="standardEdges"></g>
      </svg>

      <div id="legend" class="legend" aria-label="Build highlight legend">
        <span class="key"><span class="swatch origin"></span> Compilation root</span>
        <span class="key"><span class="swatch participant"></span> Build participant</span>
      </div>
    </section>
  </main>

  <script>
    const thematicPlanes = [];

    // Teaching whiteboard only — Lexiom OSNGs may declare many standard ancestors.
    const TEACHING_MAX_LINKS_PER_PLANE_PAIR = 1;
    const TEACHING_NOTE_DURATION_MS = 7000;

    const BUILD_SCOPE_LABELS = {
      native_axis: 'OSN + descendants + native ancestors',
      with_cited_cones: 'OSN + descendants + native ancestors + cited standard-ancestor cones'
    };

    const TREE_TEMPLATE = [
      { localId: '0', x: 50, y: 0, parent: null, root: true },
      { localId: '1', x: 27, y: 49, parent: '0' },
      { localId: '2', x: 73, y: 49, parent: '0' },
      { localId: '3', x: 14, y: 80, parent: '1' },
      { localId: '4', x: 40, y: 80, parent: '1' },
      { localId: '5', x: 60, y: 80, parent: '2' },
      { localId: '6', x: 86, y: 80, parent: '2' }
    ];

    const nodes = [];
    const byId = new Map();
    const children = new Map();

    // Each item points from the descendant OSN toward its direct standard ancestor.
    const standardLinks = [];
    const visiblePlanes = new Set();
    const nativeDepthRevealedByPlane = new Map();
    let mode = null;
    let linkSourceId = null;
    let teachingNoteTimer = null;

    const layerThemeInput = document.getElementById('layerThemeInput');
    const createLayer = document.getElementById('createLayer');
    const removeLayer = document.getElementById('removeLayer');
    const revealNativeLayer = document.getElementById('revealNativeLayer');
    const hideNativeLayer = document.getElementById('hideNativeLayer');
    const standardAction = document.getElementById('standardAction');
    const deleteStandardAction = document.getElementById('deleteStandardAction');
    const buildScopeSelect = document.getElementById('buildScopeSelect');
    const buildAction = document.getElementById('buildAction');
    const clearAction = document.getElementById('clearAction');
    const planes = document.getElementById('planes');
    const edges = document.getElementById('edges');
    const nativeEdges = document.getElementById('nativeEdges');
    const standardEdges = document.getElementById('standardEdges');
    const status = document.getElementById('status');
    const legend = document.getElementById('legend');
    const teachingNote = document.getElementById('teachingNote');

    createLayer.addEventListener('click', createLayerFromInput);
    removeLayer.addEventListener('click', removeLayerFromInput);
    syncLayerThemeButtons();
    layerThemeInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        createLayerFromInput();
      }
    });
    revealNativeLayer.addEventListener('click', revealNextNativeGeneration);
    hideNativeLayer.addEventListener('click', hidePreviousNativeGeneration);

    standardAction.addEventListener('click', () => {
      if (mode === 'standard') return resetMode('Standard-ancestor action cancelled.');
      clearBuildHighlight();
      mode = 'standard';
      linkSourceId = null;
      syncActionButtons();
      status.textContent = 'Standard Ancestor: select the descendant OSN first.';
    });

    deleteStandardAction.addEventListener('click', () => {
      if (mode === 'delete-standard') return resetMode('Delete-standard-link action cancelled.');
      clearBuildHighlight();
      mode = 'delete-standard';
      linkSourceId = null;
      syncActionButtons();
      status.textContent = 'Delete Standard Link: select the dashed standard-ancestor arrow to remove.';
    });

    buildAction.addEventListener('click', () => {
      if (mode === 'build') return resetMode('Simulate an OSN build cancelled.');
      clearBuildHighlight();
      mode = 'build';
      linkSourceId = null;
      syncActionButtons();
      const scope = buildScopeSelect.value;
      status.textContent = `Simulate an OSN build (${BUILD_SCOPE_LABELS[scope]}): select the compilation root.`;
    });

    clearAction.addEventListener('click', () => {
      clearBuildHighlight();
      resetMode('Build simulation cleared.');
      refreshActionAvailability();
    });

    window.addEventListener('resize', drawEdges);

    function formatPlaneLabel(raw) {
      return raw.trim().replace(/\s+/g, ' ').replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function slugPlaneId(raw) {
      const slug = raw.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      return slug || 'layer';
    }

    function resolvePlaneFromInput(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return null;
      const slug = slugPlaneId(trimmed);
      const label = formatPlaneLabel(trimmed);
      return thematicPlanes.find(plane => plane.id === slug)
        || thematicPlanes.find(plane => plane.label.toLowerCase() === label.toLowerCase())
        || thematicPlanes.find(plane => plane.label.toLowerCase() === trimmed.toLowerCase());
    }

    function syncLayerThemeButtons() {
      removeLayer.disabled = thematicPlanes.length === 0;
    }

    function createLayerFromInput() {
      const raw = layerThemeInput.value.trim();
      if (!raw) {
        status.textContent = 'Enter a theme name before creating a layer.';
        layerThemeInput.focus();
        return;
      }

      const label = formatPlaneLabel(raw);
      let planeId = slugPlaneId(raw);
      if (visiblePlanes.has(planeId)) {
        status.textContent = `A ${label} layer already exists on the board.`;
        return;
      }

      let suffix = 2;
      while (thematicPlanes.some(plane => plane.id === planeId)) {
        planeId = `${slugPlaneId(raw)}-${suffix}`;
        suffix += 1;
      }

      thematicPlanes.push({ id: planeId, label });
      createPlaneElement(planeId, label);
      addPlaneNodes(planeId, label);
      revealPlane(planeId);
      layerThemeInput.value = '';
      layerThemeInput.focus();
      syncLayerThemeButtons();
    }

    function removeLayerFromInput() {
      const raw = layerThemeInput.value.trim();
      if (!raw) {
        status.textContent = 'Enter a theme name to remove its layer.';
        layerThemeInput.focus();
        return;
      }

      const plane = resolvePlaneFromInput(raw);
      if (!plane) {
        status.textContent = `No ${formatPlaneLabel(raw)} layer exists on the board.`;
        return;
      }

      removePlane(plane.id);
      layerThemeInput.value = '';
      layerThemeInput.focus();
      status.textContent = `${plane.label} layer removed from the board.`;
    }

    function removePlane(planeId) {
      const planeNodeIds = new Set(nodes.filter(node => node.plane === planeId).map(node => node.id));

      for (let i = standardLinks.length - 1; i >= 0; i -= 1) {
        const link = standardLinks[i];
        if (planeNodeIds.has(link.from) || planeNodeIds.has(link.to)) standardLinks.splice(i, 1);
      }

      planeNodeIds.forEach(id => {
        document.getElementById(`node-${id}`)?.remove();
        byId.delete(id);
        children.delete(id);
      });

      for (let i = nodes.length - 1; i >= 0; i -= 1) {
        if (nodes[i].plane === planeId) nodes.splice(i, 1);
      }

      document.querySelector(`.plane[data-plane="${planeId}"]`)?.remove();
      visiblePlanes.delete(planeId);
      nativeDepthRevealedByPlane.delete(planeId);

      const index = thematicPlanes.findIndex(plane => plane.id === planeId);
      if (index >= 0) thematicPlanes.splice(index, 1);

      clearBuildHighlight();
      if (linkSourceId && planeNodeIds.has(linkSourceId)) resetMode();
      else if (mode) resetMode();

      syncPlanesLayout();
      syncNodeVisibility();
      refreshActionAvailability();
      syncLayerThemeButtons();
    }

    function createPlaneElement(planeId, label) {
      const section = document.createElement('section');
      section.className = 'plane';
      section.dataset.plane = planeId;
      section.setAttribute('aria-label', `${label} thematic lineage plane`);
      const title = document.createElement('h2');
      title.className = 'plane-title';
      title.textContent = label;
      section.appendChild(title);
      planes.appendChild(section);
    }

    function addPlaneNodes(planeId, label) {
      const localToGlobal = new Map();
      TREE_TEMPLATE.forEach(template => {
        const id = `${planeId}-${template.localId}`;
        localToGlobal.set(template.localId, id);
        const node = {
          id,
          plane: planeId,
          label: `${label} [${template.localId}]`,
          x: template.x,
          y: template.y,
          parent: template.parent ? localToGlobal.get(template.parent) : null,
          root: Boolean(template.root)
        };
        nodes.push(node);
        byId.set(id, node);
        children.set(id, []);
      });
      nodes
        .filter(node => node.plane === planeId && node.parent)
        .forEach(node => children.get(node.parent).push(node.id));
      nodes.filter(node => node.plane === planeId).forEach(mountNode);
    }

    function mountNode(node) {
      const plane = document.querySelector(`.plane[data-plane="${node.plane}"]`);
      const button = document.createElement('button');
      button.type = 'button';
      button.id = `node-${node.id}`;
      button.className = `node graph-element hidden${node.root ? ' root' : ''}`;
      button.dataset.nodeId = node.id;
      button.style.left = `${node.x}%`;
      button.style.top = `${node.y}%`;
      button.textContent = node.label;
      const role = node.root ? 'root trunk OSN planted on the' : 'OSN in the';
      button.setAttribute('aria-label', `${node.label}, ${role} ${planeLabel(node.plane)} thematic lineage plane`);
      button.addEventListener('click', () => onNodeClick(node.id));
      plane.appendChild(button);
    }

    function revealPlane(planeId) {
      if (visiblePlanes.has(planeId)) return;
      visiblePlanes.add(planeId);
      nativeDepthRevealedByPlane.set(planeId, 0);
      syncPlanesLayout();
      syncNodeVisibility();
      refreshActionAvailability();
      status.textContent = `${planeLabel(planeId)} layer created with its root OSN. Create the next OSN generation when ready.`;
    }

    function revealNextNativeGeneration() {
      let revealed = false;
      visiblePlanes.forEach(planeId => {
        const current = nativeDepthRevealedByPlane.get(planeId) ?? -1;
        const maxDepth = maxNativeDepth(planeId);
        if (current < maxDepth) {
          nativeDepthRevealedByPlane.set(planeId, current + 1);
          revealed = true;
        }
      });
      if (!revealed) return;
      syncNodeVisibility();
      refreshActionAvailability();
      syncRevealNativeButton();
      const deepest = Math.max(...[...visiblePlanes].map(id => nativeDepthRevealedByPlane.get(id)));
      if (!canRevealMoreNative()) {
        status.textContent = 'Full native inheritance is visible on all layers. Choose an action, then select an OSN.';
        return;
      }
      status.textContent = `Native generation ${deepest + 1} revealed. Click again to expose the next level.`;
    }

    function hidePreviousNativeGeneration() {
      let hidden = false;
      visiblePlanes.forEach(planeId => {
        const current = nativeDepthRevealedByPlane.get(planeId) ?? 0;
        if (current > 0) {
          nativeDepthRevealedByPlane.set(planeId, current - 1);
          hidden = true;
        }
      });
      if (!hidden) return;
      clearBuildHighlight();
      if (linkSourceId) {
        const source = byId.get(linkSourceId);
        if (!isNodeVisible(source)) resetMode();
      }
      syncNodeVisibility();
      refreshActionAvailability();
      syncRevealNativeButton();
      const shallowest = Math.max(...[...visiblePlanes].map(id => nativeDepthRevealedByPlane.get(id)));
      status.textContent = shallowest === 0
        ? 'Only the root OSN remains visible on each layer.'
        : `Native generation ${shallowest + 1} is now the deepest visible level.`;
    }

    function syncPlanesLayout() {
      const count = visiblePlanes.size;
      planes.classList.toggle('hidden', count === 0);
      planes.classList.remove('count-1', 'count-2', 'count-many');
      if (count === 1) planes.classList.add('count-1');
      else if (count === 2) planes.classList.add('count-2');
      else if (count > 2) planes.classList.add('count-many');
      if (count === 0) {
        nativeDepthRevealedByPlane.clear();
        clearBuildHighlight();
        resetMode();
      }
      syncRevealNativeButton();
    }

    function syncRevealNativeButton() {
      revealNativeLayer.disabled = !canRevealMoreNative();
      hideNativeLayer.disabled = !canHideNativeGeneration();
    }

    function canRevealMoreNative() {
      if (visiblePlanes.size === 0) return false;
      return [...visiblePlanes].some(planeId => {
        const current = nativeDepthRevealedByPlane.get(planeId) ?? -1;
        return current < maxNativeDepth(planeId);
      });
    }

    function canHideNativeGeneration() {
      if (visiblePlanes.size === 0) return false;
      return [...visiblePlanes].some(planeId => (nativeDepthRevealedByPlane.get(planeId) ?? 0) > 0);
    }

    function getNodeDepth(nodeId) {
      let depth = 0;
      let current = byId.get(nodeId);
      while (current.parent) {
        depth += 1;
        current = byId.get(current.parent);
      }
      return depth;
    }

    function maxNativeDepth(planeId) {
      return Math.max(0, ...nodes.filter(node => node.plane === planeId).map(node => getNodeDepth(node.id)));
    }

    function isNodeVisible(node) {
      if (!visiblePlanes.has(node.plane)) return false;
      const revealedDepth = nativeDepthRevealedByPlane.get(node.plane);
      if (revealedDepth === undefined) return false;
      return getNodeDepth(node.id) <= revealedDepth;
    }

    function syncNodeVisibility() {
      nodes.forEach(node => {
        const element = document.getElementById(`node-${node.id}`);
        if (element) element.classList.toggle('hidden', !isNodeVisible(node));
      });
      edges.classList.toggle('hidden', visiblePlanes.size === 0);
      requestAnimationFrame(drawEdges);
    }

    function planePairKey(planeA, planeB) {
      return [planeA, planeB].sort().join('::');
    }

    function planeLabel(planeId) {
      const plane = thematicPlanes.find(entry => entry.id === planeId);
      return plane ? plane.label : planeId;
    }

    function linkPlanePair(link) {
      const from = byId.get(link.from);
      const to = byId.get(link.to);
      return planePairKey(from.plane, to.plane);
    }

    function countLinksForPlanePair(planeA, planeB) {
      const key = planePairKey(planeA, planeB);
      return standardLinks.filter(link => linkPlanePair(link) === key).length;
    }

    function canAddLinkBetweenPlanes(planeA, planeB) {
      return countLinksForPlanePair(planeA, planeB) < TEACHING_MAX_LINKS_PER_PLANE_PAIR;
    }

    function teachingLimitMessage(planeA, planeB) {
      return `Teaching simplification: only ${TEACHING_MAX_LINKS_PER_PLANE_PAIR} standard-ancestor link between ${planeLabel(planeA)} and ${planeLabel(planeB)} on this whiteboard — not a Lexiom OSNG rule. Delete the existing link to replace it, or add a new thematic plane for another slot.`;
    }

    function showTeachingNote(message) {
      clearTimeout(teachingNoteTimer);
      teachingNote.textContent = message;
      teachingNote.classList.remove('hidden');
      teachingNoteTimer = setTimeout(() => {
        teachingNote.classList.add('hidden');
        teachingNote.textContent = '';
        teachingNoteTimer = null;
      }, TEACHING_NOTE_DURATION_MS);
    }

    function onNodeClick(nodeId) {
      if (mode === 'standard') return handleStandardSelection(nodeId);
      if (mode === 'build') return showBuildClosure(nodeId);
      if (mode === 'delete-standard') {
        status.textContent = 'Select a dashed standard-ancestor arrow, not an OSN.';
        return;
      }
      status.textContent = `${byId.get(nodeId).label} selected. Choose an action first.`;
    }

    function handleStandardSelection(nodeId) {
      const node = byId.get(nodeId);
      if (!linkSourceId) {
        const otherVisiblePlanes = [...visiblePlanes].filter(planeId => planeId !== node.plane);
        if (otherVisiblePlanes.length === 0) {
          status.textContent = 'Create another thematic layer before adding a standard ancestor.';
          return;
        }
        const saturated = otherVisiblePlanes.every(planeId => !canAddLinkBetweenPlanes(node.plane, planeId));
        if (saturated) {
          showTeachingNote(teachingLimitMessage(node.plane, otherVisiblePlanes[0]));
          status.textContent = `Cannot add another cross-plane link from ${planeLabel(node.plane)}.`;
          return;
        }
        linkSourceId = nodeId;
        document.getElementById(`node-${nodeId}`).classList.add('link-source');
        status.textContent = `Descendant: ${node.label}. Now select its standard ancestor in another plane.`;
        return;
      }

      const source = byId.get(linkSourceId);
      if (source.plane === node.plane) {
        status.textContent = 'A standard ancestor must belong to a different thematic lineage plane.';
        return;
      }

      if (!canAddLinkBetweenPlanes(source.plane, node.plane)) {
        showTeachingNote(teachingLimitMessage(source.plane, node.plane));
        status.textContent = `That plane pair already has its teaching link.`;
        return;
      }

      const duplicate = standardLinks.some(link => link.from === source.id && link.to === node.id);
      document.getElementById(`node-${source.id}`).classList.remove('link-source');
      if (!duplicate) standardLinks.push({ from: source.id, to: node.id });
      drawEdges();
      resetMode(duplicate
        ? 'That direct standard-ancestor relationship already exists.'
        : `${source.label} now points to direct standard ancestor ${node.label}.`);
      refreshActionAvailability();
    }

    function showBuildClosure(originId) {
      clearBuildHighlight();
      const scope = buildScopeSelect.value;
      const closure = calculateBuildClosure(originId, scope);
      const visibleClosure = [...closure].filter(id => isNodeVisible(byId.get(id)));
      const hiddenCount = closure.size - visibleClosure.length;

      document.getElementById(`node-${originId}`).classList.add('origin');
      visibleClosure.forEach(id => {
        if (id !== originId) document.getElementById(`node-${id}`).classList.add('participant');
      });
      legend.classList.add('show');
      const origin = byId.get(originId);
      const participantCount = closure.size - 1;
      let message = `${origin.label} is the compilation root; ${participantCount} additional OSN${participantCount === 1 ? '' : 's'} participate (${BUILD_SCOPE_LABELS[scope]}).`;
      if (hiddenCount > 0) {
        message += ` ${hiddenCount} participant${hiddenCount === 1 ? ' is' : 's are'} not yet revealed — use intra-theme lineage + to show them.`;
      }
      resetMode(message);
      refreshActionAvailability();
    }

    function getStandardAncestorIds(nodeId) {
      return standardLinks
        .filter(link => link.from === nodeId)
        .map(link => link.to);
    }

    function calculateBuildClosure(originId, scope) {
      const closure = new Set();
      const root = byId.get(originId);
      if (!root) return closure;
      gatherCompilationOsns(root, scope, closure);
      return closure;
    }

    function gatherCompilationOsns(root, scope, closure) {
      collectDescendantOsns(root.id, closure);
      collectNativeAncestorOsns(root.id, closure);
      if (scope === 'with_cited_cones') {
        getStandardAncestorIds(root.id).forEach(citedId => includeCitedSpecCone(citedId, closure));
      }
    }

    function collectDescendantOsns(nodeId, closure) {
      if (closure.has(nodeId)) return;
      closure.add(nodeId);
      (children.get(nodeId) || []).forEach(childId => collectDescendantOsns(childId, closure));
    }

    function collectNativeAncestorOsns(nodeId, closure) {
      const node = byId.get(nodeId);
      if (!node || !node.parent || closure.has(node.parent)) return;
      closure.add(node.parent);
      collectNativeAncestorOsns(node.parent, closure);
    }

    function includeStandardAncestorNodes(nodeId, closure) {
      getStandardAncestorIds(nodeId).forEach(id => closure.add(id));
    }

    function includeCitedSpecCone(citedId, closure) {
      if (!byId.has(citedId)) return;
      collectDescendantOsns(citedId, closure);
      collectNativeAncestorOsns(citedId, closure);
      includeStandardAncestorNodes(citedId, closure);
    }

    function clearBuildHighlight() {
      document.querySelectorAll('.node').forEach(node => node.classList.remove('origin', 'participant'));
      legend.classList.remove('show');
    }

    function resetMode(message) {
      if (linkSourceId) document.getElementById(`node-${linkSourceId}`)?.classList.remove('link-source');
      mode = null;
      linkSourceId = null;
      syncActionButtons();
      if (message) status.textContent = message;
    }

    function syncActionButtons() {
      standardAction.classList.toggle('active', mode === 'standard');
      deleteStandardAction.classList.toggle('active', mode === 'delete-standard');
      buildAction.classList.toggle('active', mode === 'build');
      standardAction.setAttribute('aria-pressed', mode === 'standard');
      deleteStandardAction.setAttribute('aria-pressed', mode === 'delete-standard');
      buildAction.setAttribute('aria-pressed', mode === 'build');
    }

    function hasBuildHighlight() {
      return legend.classList.contains('show') || Boolean(document.querySelector('.node.origin'));
    }

    function refreshActionAvailability() {
      const hasVisibleNodes = nodes.some(isNodeVisible);
      const bothLayersVisible = visiblePlanes.size >= 2;
      standardAction.disabled = !hasVisibleNodes || !bothLayersVisible;
      deleteStandardAction.disabled = !hasVisibleNodes || standardLinks.length === 0;
      buildAction.disabled = !hasVisibleNodes;
      clearAction.disabled = !hasBuildHighlight();
    }

    function drawEdges() {
      nativeEdges.replaceChildren();
      standardEdges.replaceChildren();
      if (visiblePlanes.size === 0 || edges.classList.contains('hidden')) return;

      nodes
        .filter(node => {
          if (!node.parent || !visiblePlanes.has(node.plane)) return false;
          const parent = byId.get(node.parent);
          return isNodeVisible(node) && isNodeVisible(parent);
        })
        .forEach(node => {
        const path = makeOrthogonalPath(node.id, node.parent, false);
        path.setAttribute('class', 'native-edge');
        nativeEdges.appendChild(path);
      });

      standardLinks.forEach((link, index) => {
        const from = byId.get(link.from);
        const to = byId.get(link.to);
        if (!isNodeVisible(from) || !isNodeVisible(to)) return;
        const path = makeOrthogonalPath(link.from, link.to, true);
        path.setAttribute('class', 'standard-edge');
        path.dataset.linkIndex = index;
        path.addEventListener('click', () => {
          if (mode !== 'delete-standard') {
            status.textContent = 'Choose Delete Standard Link before selecting a dashed arrow.';
            return;
          }
          const removed = standardLinks[Number(path.dataset.linkIndex)];
          standardLinks.splice(Number(path.dataset.linkIndex), 1);
          clearBuildHighlight();
          const fromLabel = byId.get(removed.from).label;
          const toLabel = byId.get(removed.to).label;
          resetMode(`Standard-ancestor link from ${fromLabel} to ${toLabel} removed.`);
          refreshActionAvailability();
          drawEdges();
        });
        standardEdges.appendChild(path);
      });
    }

    function makeOrthogonalPath(fromId, toId, crossPlane) {
      const from = nodeAnchor(fromId, toId, true);
      const to = nodeAnchor(toId, fromId, false);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      let d;
      if (crossPlane) {
        d = `M ${from.x} ${from.y} L ${to.x} ${to.y}`;
      } else {
        const middleY = (from.y + to.y) / 2;
        d = `M ${from.x} ${from.y} V ${middleY} H ${to.x} V ${to.y}`;
      }
      path.setAttribute('d', d);
      return path;
    }

    function nodeAnchor(fromId, otherId, isStart) {
      const boardRect = document.getElementById('board').getBoundingClientRect();
      const rect = document.getElementById(`node-${fromId}`).getBoundingClientRect();
      const otherRect = document.getElementById(`node-${otherId}`).getBoundingClientRect();
      const center = { x: rect.left - boardRect.left + rect.width / 2, y: rect.top - boardRect.top + rect.height / 2 };
      const other = { x: otherRect.left - boardRect.left + otherRect.width / 2, y: otherRect.top - boardRect.top + otherRect.height / 2 };
      const dx = other.x - center.x;
      const dy = other.y - center.y;

      if (Math.abs(dx) > Math.abs(dy)) {
        const direction = dx >= 0 ? 1 : -1;
        return { x: center.x + direction * rect.width / 2, y: center.y };
      }
      const direction = dy >= 0 ? 1 : -1;
      return { x: center.x, y: center.y + direction * rect.height / 2 };
    }
  </script>
</body>
</html>
